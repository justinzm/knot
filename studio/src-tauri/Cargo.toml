[package]
name = "knot-studio"
version = "0.1.0"
description = "Local desktop workflow builder for Knot"
authors = ["Knot Studio"]
edition = "2021"

[lib]
name = "knot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
